version: '3.8'

services:
  mongo-test:
    container_name: mongo-test
    image: mongo:latest
    ports:
      - '27018:27017' # Using a different host port to avoid conflict with dev
    volumes:
      - mongo-test-data:/data/db
      - ./server/scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=library_management_test
    env_file:
      - .env.dev
    networks:
      - test-network

  # --- CI/Single-Run Test Services ---
  api-tester:
    container_name: api-tester
    build:
      context: ./server
      target: development
    depends_on:
      - mongo-test
    volumes:
      - ./server:/app
      - /app/node_modules
    env_file:
      - .env.dev
    environment:
      - NODE_ENV=test
      - MONGO_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo-test:27017/library_management_test?authSource=admin
      - CI=true
      - SESSION_SECRET=test_session_secret
    command: sh -c "npm install && npm run test:api" # Assumes "test:api" is for single run
    networks:
      - test-network

  component-tester:
    container_name: component-tester
    build:
      context: ./client
      target: development
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - NODE_ENV=test
      - CI=true
    command: sh -c "npm install && npm test -- --watchAll=false --passWithNoTests"
    networks:
      - test-network

  # --- Services for E2E Testing (dependencies for e2e-runner and e2e-runner-watch) ---
  backend-e2e:
    container_name: backend-e2e
    build:
      context: ./server
      target: development
    ports:
      - '8081:8080'
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - mongo-test
    env_file:
      - .env.dev
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo-test:27017/library_management_test?authSource=admin
      - PORT=8080
      - CHOKIDAR_USEPOLLING=true
      - SESSION_SECRET=test_session_secret
    command: sh -c "npm install && node /app/scripts/seedDatabase.js && npm run dev"
    networks:
      - test-network

  frontend-e2e:
    container_name: frontend-e2e
    build:
      context: ./client
      target: development
    ports:
      - '3001:3000'
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - backend-e2e
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - PORT=3000
      - WATCHPACK_POLLING=true
      - REACT_APP_API_URL=http://backend-e2e:8080/api
    command: sh -c "npm install && npm start"
    networks:
      - test-network

  e2e-runner: # For single-run E2E tests
    container_name: e2e-runner
    image: cypress/included:10.10.0 # Or your preferred Cypress version
    depends_on:
      - frontend-e2e
      - backend-e2e
    environment:
      - CYPRESS_BASE_URL=http://frontend-e2e:3000
      - CYPRESS_API_URL=http://backend-e2e:8080/api
    working_dir: /e2e
    volumes:
      - ./:/e2e
    command: cypress run --config video=false
    networks:
      - test-network

  # --- Development Watch Mode Services ---
  api-tester-watch:
    container_name: api-tester-watch
    build:
      context: ./server
      target: development
    depends_on:
      - mongo-test
    volumes:
      - ./server:/app
      - /app/node_modules
    env_file:
      - .env.dev
    environment:
      - NODE_ENV=test
      - MONGO_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo-test:27017/library_management_test?authSource=admin
      - SESSION_SECRET=test_session_secret
      # CI=true is removed to allow watch mode for Jest if it behaves differently
    # Assumes "test:api:watch" script exists in server/package.json (e.g., "jest --watchAll")
    command: sh -c "npm install && npm run test:api:watch"
    networks:
      - test-network

  component-tester-watch:
    container_name: component-tester-watch
    build:
      context: ./client
      target: development
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - NODE_ENV=test
      # CI=true is removed to allow default watch mode for react-scripts test
    # Runs "npm test" which defaults to watch mode in Create React App
    command: sh -c "npm install && npm test"
    networks:
      - test-network

  e2e-runner-watch: # For interactive E2E test development with Cypress GUI
    container_name: e2e-runner-watch
    image: cypress/included:10.10.0 # Or your preferred Cypress version
    depends_on:
      - frontend-e2e
      - backend-e2e
    environment:
      - CYPRESS_BASE_URL=http://frontend-e2e:3000
      - CYPRESS_API_URL=http://backend-e2e:8080/api
      # For Linux, you might need to pass DISPLAY and mount X11 socket for GUI:
      # - DISPLAY=$DISPLAY
      # volumes:
      #  - /tmp/.X11-unix:/tmp/.X11-unix
    working_dir: /e2e
    volumes:
      - ./:/e2e
    # Runs Cypress in interactive mode.
    # Note: Requires X11 forwarding setup on your host if you want to see the GUI.
    # On Windows/Mac, this can be complex. Consider running 'cypress open' locally against Docker-served app.
    command: cypress open --project /e2e
    networks:
      - test-network

networks:
  test-network:
    driver: bridge

volumes:
  mongo-test-data:
    driver: local
