services:
  mongo-test:
    container_name: mongo-test
    image: mongo:latest
    ports:
      - '27018:27017' # Using a different host port to avoid conflict with dev
    volumes:
      - mongo-test-data:/data/db
      - ./server/scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment:
      # These will be sourced from .env.test. If blank in .env.test, MongoDB starts without default auth.
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=library_management_test
    env_file:
      - .env.test
    networks:
      - test-network

  # --- CI/Single-Run Test Services ---
  api-tester:
    container_name: api-tester
    build:
      context: ./server
      target: development # Assumes this target in server/Dockerfile uses /app/entrypoint.sh
    depends_on:
      - mongo-test
    volumes:
      - ./server:/app
      - /app/node_modules
    env_file:
      - .env.test
    environment:
      - NODE_ENV=test
      - CI=true
    # The command string is passed to sh -c for proper execution of shell operators like &&
    command: ['sh', '-c', 'npm install && node /app/scripts/seedDatabase.js && npm run test:api']
    networks:
      - test-network

  component-tester:
    container_name: component-tester
    build:
      context: ./client
      target: development
    volumes:
      - ./client:/app
      - /app/node_modules # Ensured this is active for consistency
    environment:
      - NODE_ENV=test
      - CI=true
    command: sh -c "npm test -- --watchAll=false --passWithNoTests"
    networks:
      - test-network

  # --- Services for E2E Testing (dependencies for e2e-runner and e2e-runner-watch) ---
  backend-e2e:
    container_name: backend-e2e
    build:
      context: ./server
      target: e2e-test-server
    ports:
      - '8081:8080'
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - mongo-test
    env_file:
      - .env.test
    environment:
      - NODE_ENV=test
      - PORT=8080
      - CHOKIDAR_USEPOLLING=true
      - SESSION_SECRET=${SESSION_SECRET}
      - E2E_TESTING=true
    entrypoint: ['sh', '/app/scripts/entrypoint-e2e.sh']
    networks:
      - test-network

  frontend-e2e:
    container_name: frontend-e2e
    build:
      context: ./client
      target: development
    ports:
      - '3001:3000'
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - backend-e2e
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - PORT=3000
      - WATCHPACK_POLLING=true
      - REACT_APP_API_URL=http://backend-e2e:8080/api
    command: sh -c "npm start"
    networks:
      - test-network

  e2e-runner: # For single-run E2E tests
    container_name: e2e-runner
    image: cypress/included:10.10.0 # Or your preferred Cypress version
    depends_on:
      - frontend-e2e
      - backend-e2e
    env_file:
      - .env.test
    environment:
      - CYPRESS_BASE_URL=http://frontend-e2e:3000
      - CYPRESS_API_URL=http://backend-e2e:8080/api
    working_dir: /e2e
    volumes:
      - ./:/e2e
    command: cypress run --config video=false
    networks:
      - test-network

  # --- Development Watch Mode Services ---
  api-tester-watch:
    container_name: api-tester-watch
    build:
      context: ./server
      target: development
    depends_on:
      - mongo-test
    volumes:
      - ./server:/app
      - /app/node_modules
    env_file:
      - .env.test
    environment:
      - NODE_ENV=test
      - SESSION_SECRET=${SESSION_SECRET}
      # - CHOKIDAR_USEPOLLING=true # Optional: Add if file watching is unreliable
    entrypoint: ['/bin/sh', '-c']
    command: 'node /app/scripts/seedDatabase.js && npm run test:api:watch'
    networks:
      - test-network

  component-tester-watch:
    container_name: component-tester-watch
    build:
      context: ./client
      target: development
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - NODE_ENV=test
      # - WATCHPACK_POLLING=true   # Optional: For react-scripts test, if watching is unreliable
      # - CHOKIDAR_USEPOLLING=true # General alternative for polling
    command: sh -c "npm test" # This should default to watch mode if CI=false
    stdin_open: true # Keep STDIN open for interactive watch mode
    tty: true # Allocate a TTY for interactive watch mode
    networks:
      - test-network

  e2e-runner-watch: # For interactive E2E test development with Cypress GUI
    container_name: e2e-runner-watch
    image: cypress/included:10.10.0 # Or your preferred Cypress version
    depends_on:
      - frontend-e2e
      - backend-e2e
    env_file:
      - .env.test
    environment:
      - CYPRESS_BASE_URL=http://frontend-e2e:3000
      - CYPRESS_API_URL=http://backend-e2e:8080/api
    working_dir: /e2e
    volumes:
      - ./:/e2e
    # Expose Cypress GUI port if needed, though typically accessed via X11 forwarding or similar
    # ports:
    #   - "XXXX:XXXX"
    command: cypress open --project /e2e
    networks:
      - test-network

networks:
  test-network:
    driver: bridge

volumes:
  mongo-test-data:
    driver: local
